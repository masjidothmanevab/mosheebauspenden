<style>
/* Layout: "Midnight" wall display, fixed 1920x1080 stage scaled to the screen. Dark ground with green and gold glow, glass cards.
   Left: month total + goal bar. Right: clock, three figures, daily curve beside monthly bars. Single dark theme on purpose: it is a TV in the mosque. */
:root{
  --bg:#0b1512; --fg:#eef3ef; --muted:rgba(238,243,239,.68); --glass:rgba(255,255,255,.06); --edge:rgba(255,255,255,.12);
  --green:#1f9a6c; --green-deep:#0f6b4b; --gold:#efd79b; --gold-deep:#b8892b;
  --font:"Inter","Segoe UI",system-ui,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:20px;line-height:1.35;font-variant-numeric:tabular-nums}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;box-sizing:border-box;padding:56px 64px;
  display:grid;grid-template-columns:1.05fr 1.6fr;grid-template-rows:auto 1fr;gap:28px 40px}
.stage::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 600px at 15% 20%,rgba(31,154,108,.28),transparent 60%),
  radial-gradient(800px 500px at 90% 90%,rgba(184,137,43,.22),transparent 60%);pointer-events:none}
.stage>*{position:relative}
.ar{font-family:var(--font-ar);display:block;direction:rtl;text-align:left;unicode-bidi:plaintext;opacity:.72;font-size:.92em;margin-top:.1em}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:28px;font-weight:600;display:flex;align-items:center;gap:16px}
.brand img.logo{height:96px;width:auto;flex:none;filter:drop-shadow(0 0 16px rgba(31,154,108,.45))}
.brand i{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green-deep));display:grid;place-items:center;box-shadow:0 0 30px rgba(31,154,108,.6);flex:none}
.brand i::after{content:"";width:18px;height:18px;border:2.5px solid var(--gold);transform:rotate(45deg)}
.clock{text-align:right;font-weight:300;font-size:44px;line-height:1}
.clock small{display:block;font-size:17px;color:var(--muted);margin-top:6px;font-weight:400}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:28px;backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 60px rgba(0,0,0,.35)}
.hero{padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.lab{font-size:20px;color:var(--muted)}
.kpi .k{font-size:22px;color:var(--muted);font-weight:500}
.kpi .k .ar{font-size:.95em}
.big{font-size:112px;font-weight:600;line-height:1;letter-spacing:-.03em;margin:8px 0 0;color:#fff;text-shadow:0 0 40px rgba(31,154,108,.55)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pair .kpi{background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:20px;padding:20px 24px}
.pair .v{font-size:54px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.02em}
.pair .need .v{color:var(--gold)}
.goal{display:grid;gap:10px}
.bar{position:relative;height:34px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--gold));box-shadow:0 0 24px rgba(239,215,155,.6);
  width:var(--w,0%);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bar .pct{position:absolute;top:0;bottom:0;display:flex;align-items:center;left:calc(var(--w,0%) + 14px);font-size:20px;font-weight:600;color:#fff;white-space:nowrap;transition:left 1.6s cubic-bezier(.2,.8,.2,1)}
.ticks{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.note{font-size:16px;color:var(--muted)}
.right{display:grid;grid-template-rows:auto 1fr;gap:28px;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tile{padding:26px 28px}
.tile .lab{white-space:nowrap}
.tile .lab{font-size:17px}
.tile .v{font-size:46px;font-weight:600;line-height:1.1;margin-top:8px;color:var(--gold)}
.charts{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;min-height:0}
.panel{padding:28px 32px;display:flex;flex-direction:column;gap:12px;min-height:0}
.panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{margin:0;font-size:20px;font-weight:500}
.key{font-size:15px;color:var(--muted);display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:center}
.key::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);grid-row:span 2}
.chart{flex:1;min-height:0;position:relative}
.chart svg{position:absolute;inset:0;display:block;overflow:visible}
.chart text{fill:rgba(255,255,255,.55);font-family:var(--font)}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade 1.2s ease-out both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(.02)}}
@keyframes fade{from{opacity:0}}
/* new donation pop-up */
  box-shadow:0 0 120px rgba(31,154,108,.45),inset 0 1px 0 rgba(255,255,255,.15);animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.draw,.grow,.fade{animation:none!important;stroke-dashoffset:0}.bar i{transition:none}}
/* turning card: quote of the day on the front, latest donations on the back */
.flip{position:relative;min-height:0;perspective:2400px}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform 1.4s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip .front{transform:rotateY(0deg)}.flip .back{transform:rotateY(180deg)}
.flip.turned .front{transform:rotateY(-180deg)}.flip.turned .back{transform:rotateY(0deg)}
.feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding-top:4px}
.feed .it{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08);animation:slide .8s cubic-bezier(.2,.8,.2,1) both}
.feed .it:last-child{border-bottom:0}
.feed .amt{font-size:40px;font-weight:600;color:#fff;letter-spacing:-.02em}.feed .it:first-child .amt{color:var(--gold);text-shadow:0 0 24px rgba(239,215,155,.5)}
.feed .when{font-size:19px;color:var(--muted)}.feed .it:first-child .when{color:var(--gold)}
@keyframes slide{from{opacity:0;transform:translateY(-18px)}}
.quote #f2{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;text-align:center}
.quote .arq{font-family:var(--font-ar);font-size:38px;line-height:1.7;direction:rtl;color:#fff}
.quote .deq{font-size:25px;line-height:1.45;color:rgba(238,243,239,.9)}
.quote .src{font-size:16px;color:var(--muted);letter-spacing:.06em}
/* Phone layout: portrait screens get a stacked, scrollable page instead of the shrunk TV picture. */
body.mobile,body.mobile html{overflow:auto}
html.mobile,html.mobile body{height:auto;overflow:auto}
body.mobile .stage{position:static;width:100%;height:auto;transform:none!important;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
body.mobile .stage::before{position:fixed}
body.mobile header{flex-direction:column;align-items:flex-start;gap:10px}
body.mobile .brand{font-size:22px}body.mobile .brand img.logo{height:64px}
body.mobile .clock{text-align:left;font-size:34px}
body.mobile .hero{padding:24px 22px;gap:14px}
body.mobile .big{font-size:52px}
body.mobile .pair{grid-template-columns:1fr;gap:12px}body.mobile .pair .kpi{padding:14px 16px}body.mobile .pair .v{font-size:30px}
body.mobile .bar{height:28px}body.mobile .bar .pct{font-size:16px}body.mobile .ticks{font-size:12px}
body.mobile .right{display:flex;flex-direction:column;gap:16px}
body.mobile .tiles{grid-template-columns:1fr;gap:12px}body.mobile .tile{padding:18px 20px}body.mobile .tile .v{font-size:36px}
body.mobile .charts{display:flex;flex-direction:column;gap:16px}
body.mobile .flip{perspective:none;display:flex;flex-direction:column;gap:16px}
body.mobile .flip .face{position:static;transform:none!important;transition:none;backface-visibility:visible}
body.mobile .panel{padding:22px 20px}
body.mobile .quote #f2{min-height:0;padding:10px 0}
body.mobile .quote .arq{font-size:28px!important}body.mobile .quote .deq{font-size:19px!important}
body.mobile .feed .amt{font-size:28px}body.mobile .feed .when{font-size:15px}
body.mobile .chart{height:300px;flex:none}
</style>

{"ar":"مَنْ بَنَى مَسْجِدًا لِلَّهِ بَنَى اللَّهُ لَهُ بَيْتًا فِي الْجَنَّةِ","de":"Wer eine Moschee für Allah baut, dem baut Allah ein Haus im Paradies.","src":"HADITH · BUKHARI & MUSLIM"},
{"ar":"مَّثَلُ الَّذِينَ يُنفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنبُلَةٍ مِّائَةُ حَبَّةٍ","de":"Das Gleichnis derer, die ihr Vermögen auf Allahs Weg ausgeben, ist das eines Saatkorns, das sieben Ähren wachsen lässt, in jeder Ähre hundert Körner.","src":"KORAN · AL-BAQARA 2:261"},
{"ar":"الصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ الْمَاءُ النَّارَ","de":"Die Spende löscht die Sünde aus, wie Wasser das Feuer löscht.","src":"HADITH · TIRMIDHI"},
{"ar":"الَّذِينَ يُنفِقُونَ أَمْوَالَهُم بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ","de":"Diejenigen, die ihr Vermögen bei Nacht und bei Tag, heimlich und öffentlich ausgeben, haben ihren Lohn bei ihrem Herrn.","src":"KORAN · AL-BAQARA 2:274"},
{"ar":"لَن تَنَالُوا الْبِرَّ حَتَّىٰ تُنفِقُوا مِمَّا تُحِبُّونَ","de":"Ihr werdet die Güte nicht erlangen, bis ihr von dem ausgebt, was ihr liebt.","src":"KORAN · AL-IMRAN 3:92"},
{"ar":"مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ","de":"Keine Spende hat jemals ein Vermögen verringert.","src":"HADITH · MUSLIM"},
{"ar":"مَّن ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً","de":"Wer ist es, der Allah ein gutes Darlehen gibt, sodass Er es ihm um ein Vielfaches vermehrt?","src":"KORAN · AL-BAQARA 2:245"},
{"ar":"إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَمَلُهُ إِلاَّ مِنْ ثَلاَثَةٍ: صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ","de":"Wenn der Mensch stirbt, enden seine Taten, außer dreien: eine fortdauernde Spende, nützliches Wissen und ein rechtschaffenes Kind, das für ihn bittet.","src":"HADITH · MUSLIM"},
{"ar":"وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ","de":"Was ihr an Gutem für euch selbst vorausschickt, das werdet ihr bei Allah finden.","src":"KORAN · AL-BAQARA 2:110"},
{"ar":"الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى","de":"Die gebende Hand ist besser als die nehmende Hand.","src":"HADITH · BUKHARI"},
{"ar":"إِنَّ الْمُصَّدِّقِينَ وَالْمُصَّدِّقَاتِ وَأَقْرَضُوا اللَّهَ قَرْضًا حَسَنًا يُضَاعَفُ لَهُمْ وَلَهُمْ أَجْرٌ كَرِيمٌ","de":"Den Männern und Frauen, die spenden und Allah ein gutes Darlehen geben, wird es vervielfacht, und ihnen gebührt ein edler Lohn.","src":"KORAN · AL-HADID 57:18"},
{"ar":"كُلُّ امْرِئٍ فِي ظِلِّ صَدَقَتِهِ حَتَّى يُفْصَلَ بَيْنَ النَّاسِ","de":"Jeder Mensch steht im Schatten seiner Spende, bis zwischen den Menschen gerichtet wird.","src":"HADITH · AHMAD"},
{"ar":"إِن تُبْدُوا الصَّدَقَاتِ فَنِعِمَّا هِيَ ۖ وَإِن تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَّكُمْ","de":"Wenn ihr Spenden offen gebt, so ist es gut. Wenn ihr sie verbergt und den Bedürftigen gebt, so ist es besser für euch.","src":"KORAN · AL-BAQARA 2:271"},
{"ar":"وَأَنفِقُوا خَيْرًا لِّأَنفُسِكُمْ ۗ وَمَن يُوقَ شُحَّ نَفْسِهِ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ","de":"Gebt aus, das ist gut für euch selbst. Wer vor dem Geiz seiner Seele bewahrt bleibt, das sind die Erfolgreichen.","src":"KORAN · AT-TAGHABUN 64:16"}

// "Today" follows the real calendar in Berlin, not the date of the last donation, so the day tile resets to 0 € at midnight.
let TODAY,now,mk;
function setToday(){TODAY=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Berlin'});now=D(TODAY);mk=TODAY.slice(0,7)}
setToday();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;

function countTo(el,v,fmt){
  if(still){el.textContent=fmt(v);return}
  const t0=performance.now(),dur=1400;
  (function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(v*e);if(p<1)requestAnimationFrame(step)})(t0);
}
function tick(){
  const n=new Date();
  if(n.toLocaleDateString('sv-SE',{timeZone:'Europe/Berlin'})!==TODAY){setToday();renderText();renderCharts()}
  $('time').textContent=n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'});
  $('date').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Berlin'});
  $('dateAr').textContent=n.toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Berlin'});
}
function renderText(){
  const inM=DONATIONS.filter(x=>x.d.startsWith(mk));
  const w7=new Date(now);w7.setUTCDate(now.getUTCDate()-6);const wk=w7.toISOString().slice(0,10);
  // Campaign total = bank balance on its date + PayPal donations received after that date (those are not yet on the bank).
  const sincePP=sum(DONATIONS.filter(x=>x.d>=CFG.bank_date)), raised=CFG.bank_balance+sincePP;
  const pct=Math.min(100,raised/CFG.campaign_goal*100);
  countTo($('raised'),raised,v=>eur0.format(v));
  countTo($('remaining'),Math.max(0,CFG.campaign_goal-raised),v=>eur0.format(v));
  $('raisedSub').textContent=`Bank ${eur0.format(CFG.bank_balance)} (Stand ${fTick.format(D(CFG.bank_date))}) + PayPal seitdem ${eur.format(sincePP)}`;
  $('goalAmt').textContent=eur0.format(CFG.campaign_goal);
  document.querySelector('.ticks').innerHTML=[0,.25,.5,.75,1].map(f=>`<span>${eur0.format(CFG.campaign_goal*f)}</span>`).join('');
  $('goalPct').textContent=(Math.round(pct*10)/10).toLocaleString('de-DE')+' % erreicht';
  requestAnimationFrame(()=>$('goalBar').parentElement.style.setProperty('--w',pct+'%'));
  $('monthLabel').textContent=fMonth.format(now)+' · '+inM.length+' Spenden';
  $('monthLabelAr').textContent=fMonthAr.format(now)+' · عدد التبرعات: '+inM.length;
  countTo($('monthTotal'),sum(inM),v=>eur.format(v));
  $('dayLabel').textContent='Am '+fDay.format(now); $('dayLabelAr').textContent='يوم '+fDayAr.format(now);
  countTo($('day'),sum(DONATIONS.filter(x=>x.d===TODAY)),v=>eur.format(v));
  countTo($('week'),sum(DONATIONS.filter(x=>x.d>=wk&&x.d<=TODAY)),v=>eur.format(v));
}

function scale(max){const raw=max/4,mag=Math.pow(10,Math.floor(Math.log10(raw||1))),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);return{step,top:Math.ceil(max/step)*step}}
function smooth(p){const n=p.length,dx=[],m=[],t=[];for(let i=0;i<n-1;i++){dx[i]=p[i+1][0]-p[i][0];m[i]=(p[i+1][1]-p[i][1])/dx[i]}t[0]=m[0];t[n-1]=m[n-2];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:3*(dx[i-1]+dx[i])/((2*dx[i]+dx[i-1])/m[i-1]+(dx[i]+2*dx[i-1])/m[i]);let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${p[i][0]+h},${p[i][1]+t[i]*h} ${p[i+1][0]-h},${p[i+1][1]-t[i+1]*h} ${p[i+1][0]},${p[i+1][1]}`}return d}
function renderDaily(){
  // back: the latest donations, amount and time only
  const yest=new Date(now);yest.setUTCDate(now.getUTCDate()-1);const YK=yest.toISOString().slice(0,10);
  const last=DONATIONS.filter(x=>x.t).sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t)).slice(0,7);
  $('f1').innerHTML=last.map((x,i)=>{const when=(x.d===TODAY?'Heute':x.d===YK?'Gestern':fTick.format(D(x.d)))+' · '+x.t.slice(0,5)+' Uhr';
    return `<div class="it" style="animation-delay:${i*90}ms"><span class="amt">${eur.format(x.a)}</span><span class="when">${when}</span></div>`}).join('');
  // front: quote of the day, chosen by the real calendar day so it changes at midnight
  const today=new Date(),dayNo=Math.floor((Date.UTC(today.getFullYear(),today.getMonth(),today.getDate())-Date.UTC(2026,0,1))/864e5);
  const q=QUOTES[((dayNo%QUOTES.length)+QUOTES.length)%QUOTES.length];
  $('f2').innerHTML=`<div class="arq" style="font-size:${q.ar.length>90?32:38}px">${q.ar}</div><div class="deq" style="font-size:${q.de.length>110?22:25}px">„${q.de}“</div><div class="src">${q.src}</div>`;
}
// Turn the card: quote for 60 s, latest donations for 30 s.
setTimeout(function turn(){const on=isMobile()?false:$('flip').classList.toggle('turned');setTimeout(turn,on?30000:60000)},60000);
function renderMonthly(){
  const el=$('monthly'),W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;const fs=17;
  const m={};DONATIONS.forEach(x=>{const k=x.d.slice(0,7);m[k]=(m[k]||0)+x.a});m[mk]=m[mk]||0;const keys=Object.keys(m).sort().slice(-6),vals=keys.map(k=>m[k]);
  const{top}=scale(Math.max(...vals)),L=4,R=4,T=fs*1.8,B=fs*2.2,cw=(W-L-R)/keys.length,bw=cw*.55,y=v=>T+(H-T-B)*(1-v/top);
  let s=`<defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f9a6c"/><stop offset="1" stop-color="#0f6b4b"/></linearGradient></defs><line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.15)"/>`;
  keys.forEach((k,i)=>{const cx=L+i*cw+cw/2,cur=k===mk;
    s+=`<rect class="grow" style="animation-delay:${i*90}ms" x="${cx-bw/2}" y="${y(vals[i])}" width="${bw}" height="${y(0)-y(vals[i])}" rx="${Math.min(10,bw/3)}" fill="${cur?'#efd79b':'url(#gb)'}"/>`;
    s+=`<text class="fade" x="${cx}" y="${y(vals[i])-8}" text-anchor="middle" font-size="${fs}" font-weight="500" style="fill:${cur?'#efd79b':'rgba(255,255,255,.85)'}">${vals[i]>=1000?(vals[i]/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+'k':eur0.format(vals[i])}</text>`;
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="${fs}">${fM.format(D(k+'-15'))}</text>`});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spenden pro Monat, laufender Monat in Gold">${s}</svg>`;
}
function renderCharts(){renderDaily();renderMonthly()}

// Pop-up for donations that arrived since this screen last saw the data.
// Scale the fixed 1920x1080 stage to fit any screen, centred, never scrolling.
function isMobile(){return innerWidth<innerHeight||innerWidth<900}
function fit(){const m=isMobile(),was=document.body.classList.contains('mobile');document.body.classList.toggle('mobile',m);document.documentElement.classList.toggle('mobile',m);
  const st=$('stage');if(m){st.style.transform='';}else{const s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
  if(m!==was&&typeof renderCharts==='function')renderCharts()}
function start(data){
  fit();addEventListener('resize',fit);
  tick();setInterval(tick,10000);
  renderText();renderCharts();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(renderCharts);
}
window.claude?.hot?.snapshot?.(()=>({seen:DONATIONS.length}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
// Self-refresh on the mosque's own domain: every 5 minutes fetch the page and reload when a newer build is online.
if(!window.claude?.hot&&location.protocol.startsWith('http')){
  const BUILD=document.querySelector('meta[name="build"]')?.content;
  setInterval(async()=>{try{const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});const t=await r.text();
    const m=t.match(/name="build" content="([^"]+)"/);if(m&&m[1]!==BUILD)location.reload()}catch(_){}},5*60*1000);
}
</script>
